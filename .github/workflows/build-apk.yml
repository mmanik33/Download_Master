name: Build & Release Download Master

# Required GitHub Actions repository secrets for release APK signing (key alias: "upload"):
#   - KEYSTORE_BASE64 : Base64-encoded upload keystore file (.jks / .keystore)
#   - STORE_PASSWORD  : Keystore password
#   - KEY_PASSWORD    : Private key password for alias "upload"
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew || true

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          
          if [ -z "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME is not set."
            exit 1
          fi
          
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print ($1 == "1" ? $2 : $1)}')
          echo "Detected Java major version: $JAVA_MAJOR"
          
          if [ -z "$JAVA_MAJOR" ] || [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Java major version ($JAVA_MAJOR) is lower than required version 17."
            exit 1
          fi
          echo "Java 17 verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode and verify release signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "=== Verifying Release Signing Secrets ==="
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: Missing required signing secrets. Please configure KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD (for alias 'upload') in GitHub Actions repository secrets."
            exit 1
          fi

          KEYSTORE_FILE="${{ runner.temp }}/release-upload-keystore.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"

          if [ ! -f "$KEYSTORE_FILE" ] || [ ! -s "$KEYSTORE_FILE" ]; then
            echo "ERROR: Decoded release keystore file is missing or empty at $KEYSTORE_FILE."
            exit 1
          fi

          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "Release signing keystore decoded to temporary path outside repository."

      - name: Build Universal Release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC"
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "=== Building Universal Release APK ==="
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi
          gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Verify and Package Release Assets
        id: prepare_assets
        run: |
          echo "=== Verifying and Packaging Release Assets ==="
          TEMP_ASSET_DIR="${{ runner.temp }}/release-assets"
          mkdir -p "$TEMP_ASSET_DIR"
          
          APK_DIR="app/build/outputs/apk/release"
          
          # Universal APK Verification
          SRC_APK=$(find "$APK_DIR" -name "*.apk" -type f | head -n 1)
          DEST_APK="$TEMP_ASSET_DIR/Download-Master-universal-release.apk"
          
          if [ -z "$SRC_APK" ] || [ ! -f "$SRC_APK" ] || [ ! -s "$SRC_APK" ]; then
            echo "ERROR: Universal APK not found or empty in $APK_DIR!"
            exit 1
          fi
          
          cp "$SRC_APK" "$DEST_APK"
          echo "✓ Verified Universal APK: Download-Master-universal-release.apk ($(du -h "$DEST_APK" | cut -f1))"
          
          echo "asset_dir=$TEMP_ASSET_DIR" >> "$GITHUB_OUTPUT"

      - name: Verify APK Release Signature
        run: |
          echo "=== Verifying Packaged Release APK Signature ==="
          ASSET_DIR="${{ steps.prepare_assets.outputs.asset_dir }}"
          APK_FILE="$ASSET_DIR/Download-Master-universal-release.apk"

          if [ ! -f "$APK_FILE" ] || [ ! -s "$APK_FILE" ]; then
            echo "ERROR: Packaged universal release APK not found at $APK_FILE"
            exit 1
          fi

          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME/build-tools" ]; then
            echo "ERROR: ANDROID_HOME/build-tools directory not found (ANDROID_HOME='$ANDROID_HOME')."
            exit 1
          fi

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" -type f | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "ERROR: apksigner executable not found under $ANDROID_HOME/build-tools."
            exit 1
          fi

          echo "Using apksigner: $APKSIGNER"
          CERT_OUTPUT=$("$APKSIGNER" verify --print-certs "$APK_FILE")
          echo "$CERT_OUTPUT"

          if echo "$CERT_OUTPUT" | grep -q "CN=Android Debug"; then
            echo "ERROR: Release APK is signed with a debug certificate (CN=Android Debug)! Failing build."
            exit 1
          fi

          echo "✓ Release APK signature verified (non-debug certificate)."

      - name: Publish Release Assets to GitHub Releases
        id: publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Publishing to GitHub Releases ==="
          ASSET_DIR="${{ steps.prepare_assets.outputs.asset_dir }}"
          
          RELEASE_TAG="v1.0.0-build-${{ github.run_number }}"
          RELEASE_TITLE="Download Master Release Build #${{ github.run_number }}"
          
          APK_SIZE=$(du -h "$ASSET_DIR/Download-Master-universal-release.apk" | cut -f1)
          
          RELEASE_NOTES="### Download Master Release Build #${{ github.run_number }}
          
          **Release Artifacts:**
          
          #### 📱 Universal Release APK (Direct Device Installation):
          - **Universal APK:** \`Download-Master-universal-release.apk\` (~$APK_SIZE)
            *(Optimized universal installation package containing full video & audio download capabilities for all Android smartphones and tablets)*
          
          ---
          - **Commit SHA:** \`${{ github.sha }}\`
          - **Build:** GitHub Actions Run #${{ github.run_number }}"
          
          gh release create "$RELEASE_TAG" \
            "$ASSET_DIR/Download-Master-universal-release.apk" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "${{ github.sha }}" \
            --latest
      - name: Report Build & Release Result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Build & Release Summary ==="
          RELEASE_TAG="v1.0.0-build-${{ github.run_number }}"
          RELEASE_TITLE="Download Master Release Build #${{ github.run_number }}"
          
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
            echo "Release URL: $RELEASE_URL"
            
            cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ## 🚀 Download Master Release Assets Published!
          
          - **GitHub Release:** [$RELEASE_TITLE]($RELEASE_URL)
          
          ### 📱 Available Downloads:
          1. **\`Download-Master-universal-release.apk\`** — Universal installation APK for all Android devices.
          EOF
          fi
